[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "emissionmodel"
version = "0.0.1"
description = "This repo contain all information in build a machine learning model to predict the fugitive emission to the next day."
authors = [
  { name = "jmetrimiranda" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["emissionmodel"]
include = ["pyproject.toml", "emissionmodel/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["emissionmodel"]
force-sort-within-sections = true

